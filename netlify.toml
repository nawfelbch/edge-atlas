# EDGE ATLAS — site statique (dossier dist) + une fonction pour FRED.
# Binance est appelé directement par le navigateur (il refuse souvent les
# serveurs situés aux États-Unis). Twelve Data passe par twelve.mjs : la clé
# reste sur Netlify, protégée par le mot de passe du site.
# FRED n'autorise pas l'appel direct : la fonction fred.mjs relaie la lecture.
[build]
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/twelve"
  to = "/.netlify/functions/twelve"
  status = 200

[[redirects]]
  from = "/api/fred"
  to = "/.netlify/functions/fred"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
